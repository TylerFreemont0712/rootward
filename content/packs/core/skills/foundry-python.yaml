# Python track for the Foundry. Ids are py.<topic>.<concept>. `transfers_to` links to the shared concept node.
nodes:
  - { id: py.basics.values,          name: Values and types (Python),   realm: foundry, tier: 0, prerequisites: [], transfers_to: concept.values, summary: "int/float/str/bool/None, truthiness, type(), int vs float division.", evidence_tags: [values, types, numeric-precision], review_cards: 4 }
  - { id: py.basics.variables,       name: Variables and assignment,    realm: foundry, tier: 0, prerequisites: [py.basics.values], transfers_to: concept.variables, summary: "Names, rebinding, = vs ==, is vs ==.", evidence_tags: [variables, assignment-vs-equality, identity-vs-equality], review_cards: 4 }
  - { id: py.strings.basics,         name: Strings,                     realm: foundry, tier: 0, prerequisites: [py.basics.variables], transfers_to: concept.strings, summary: "Indexing, slicing, immutability, common methods, f-strings.", evidence_tags: [strings, string-immutability], review_cards: 6 }
  - { id: py.strings.split,          name: Splitting and joining,       realm: foundry, tier: 0, prerequisites: [py.strings.basics], transfers_to: concept.strings, summary: "split/join/strip, whitespace rules, normalizing case and punctuation.", evidence_tags: [strings, split, tokenizing], review_cards: 3 }
  - { id: py.control.conditionals,   name: Conditionals,                realm: foundry, tier: 0, prerequisites: [py.basics.variables], transfers_to: concept.conditionals, summary: "if/elif/else, comparison chains, guard clauses, match.", evidence_tags: [conditionals], review_cards: 4 }
  - { id: py.control.loops,          name: Loops and range,             realm: foundry, tier: 0, prerequisites: [py.control.conditionals], transfers_to: concept.iteration, summary: "for/while, range's exclusive stop, enumerate, zip, break/continue.", evidence_tags: [loops, off-by-one, iteration], review_cards: 6 }
  - { id: py.functions.define,       name: Defining functions,          realm: foundry, tier: 0, prerequisites: [py.control.loops], transfers_to: concept.functions, summary: "def, return vs print, docstrings, calling.", evidence_tags: [functions, print-vs-return], review_cards: 4 }
  - { id: py.functions.args,         name: Arguments,                   realm: foundry, tier: 1, prerequisites: [py.functions.define], transfers_to: concept.functions, summary: "Positional/keyword/default args, *args/**kwargs, the mutable default trap.", evidence_tags: [functions, mutable-default], review_cards: 4 }
  - { id: py.functions.scope,        name: Scope and closures,          realm: foundry, tier: 1, prerequisites: [py.functions.args], transfers_to: concept.functions, summary: "LEGB, global/nonlocal, closures, late binding in loops.", evidence_tags: [scope, closure-capture], review_cards: 4 }
  - { id: py.collections.list,       name: Lists,                       realm: foundry, tier: 0, prerequisites: [py.control.loops], transfers_to: concept.sequences, summary: "Indexing, slicing, append/insert/pop, copying, aliasing, mutating while iterating.", evidence_tags: [list, slicing, aliasing, mutating-while-iterating], review_cards: 6 }
  - { id: py.collections.tuple,      name: Tuples and unpacking,        realm: foundry, tier: 0, prerequisites: [py.collections.list], transfers_to: concept.sequences, summary: "Immutability, unpacking, swapping, tuples as dict keys.", evidence_tags: [tuple, unpacking], review_cards: 3 }
  - { id: py.collections.dict,       name: Dictionaries,                realm: foundry, tier: 1, prerequisites: [py.collections.list, py.strings.split], transfers_to: concept.mappings, summary: "get/setdefault, counting, iteration order, Counter/defaultdict, hashable keys.", evidence_tags: [dict, hashmap, counting, mapping], review_cards: 6 }
  - { id: py.collections.set,        name: Sets,                        realm: foundry, tier: 1, prerequisites: [py.collections.dict], transfers_to: concept.mappings, summary: "Membership in O(1), dedupe, set algebra.", evidence_tags: [set, membership, quadratic-membership], review_cards: 3 }
  - { id: py.control.comprehensions, name: Comprehensions,              realm: foundry, tier: 1, prerequisites: [py.collections.dict], transfers_to: concept.iteration, summary: "List/dict/set comprehensions, conditions, when a loop is clearer.", evidence_tags: [comprehensions], review_cards: 4 }
  - { id: py.errors.exceptions,      name: Exceptions,                  realm: foundry, tier: 1, prerequisites: [py.functions.define], transfers_to: concept.errors, summary: "try/except/else/finally, catching narrowly, raising with messages, custom exceptions.", evidence_tags: [exceptions, swallowed-error], review_cards: 5 }
  - { id: py.io.files,               name: Files and paths,             realm: foundry, tier: 1, prerequisites: [py.errors.exceptions, py.strings.split], summary: "with open, encodings, pathlib, reading lines, JSON and CSV.", evidence_tags: [files, io, resource-leak], review_cards: 4 }
  - { id: py.modules.import,         name: Modules and packages,        realm: foundry, tier: 1, prerequisites: [py.functions.define], summary: "import forms, __name__ == '__main__', venv, pip.", evidence_tags: [modules, tooling], review_cards: 3 }
  - { id: py.oop.classes,            name: Classes,                     realm: foundry, tier: 1, prerequisites: [py.functions.args, py.collections.dict], summary: "__init__, self, attributes vs class attributes, methods.", evidence_tags: [classes, oop], review_cards: 5 }
  - { id: py.oop.dunder,             name: Dunder methods and dataclasses, realm: foundry, tier: 1, prerequisites: [py.oop.classes], summary: "__repr__/__eq__/__len__/__iter__, dataclasses, ordering.", evidence_tags: [dunder, dataclasses], review_cards: 4 }
  - { id: py.iterators.generators,   name: Iterators and generators,    realm: foundry, tier: 1, prerequisites: [py.control.comprehensions, py.functions.scope], summary: "The iterator protocol, yield, laziness, infinite sequences, itertools basics.", evidence_tags: [generators, iterators, laziness], review_cards: 5 }
  - { id: py.typing.hints,           name: Type hints,                  realm: foundry, tier: 1, prerequisites: [py.functions.args, py.collections.dict], summary: "Annotations, Optional, list[int], Protocol, running a type checker.", evidence_tags: [typing, unchecked-null], review_cards: 3 }
  - { id: py.testing.pytest-basics,  name: pytest basics,               realm: foundry, tier: 1, prerequisites: [py.functions.define, py.modules.import], summary: "assert, test discovery, parametrize, arrange-act-assert.", evidence_tags: [testing, pytest], review_cards: 4 }
  - { id: py.recursion.basics,       name: Recursion (Python),          realm: grove,   tier: 1, prerequisites: [py.functions.scope, py.collections.list], transfers_to: concept.recursion, summary: "Base cases, recursion over nested lists, recursion limit.", evidence_tags: [recursion, missing-base-case], review_cards: 4 }
