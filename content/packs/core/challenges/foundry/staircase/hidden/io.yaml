# Backend-only. The player sees hidden tests by category and pass/fail, never by content.
form: io
cases:
  - id: h1
    name: a negative number of steps
    category: boundary
    stdin: "-3\n"
    expected_stdout: ""
  - id: h2
    name: a taller staircase
    category: size
    stdin: "6\n"
    expected_stdout: "     #\n    ##\n   ###\n  ####\n #####\n######\n"
  - id: h3
    name: spaces around the number
    category: format
    stdin: "  2  \n"
    expected_stdout: " #\n##\n"
  - id: h4
    name: three steps
    category: boundary
    stdin: "3\n"
    expected_stdout: "  #\n ##\n###\n"
  # Reserve cases join the fight only when an enemy's Edge Case move reveals one of their category.
  - id: r1
    name: five steps
    category: boundary
    reserve: true
    stdin: "5\n"
    expected_stdout: "    #\n   ##\n  ###\n ####\n#####\n"
