form: io
cases:
  - id: h1
    name: empty input prints nothing
    category: empty-input
    stdin: ""
    expectedStdout: ""
  - id: h2
    name: words that are only punctuation are discarded
    category: boundary
    stdin: "... hello --- ! hello\n"
    expectedStdout: "hello 2\n--- 1\n"
  - id: h3
    name: inner punctuation is kept
    category: normalization
    stdin: "don't 'don't' (don't)\n"
    expectedStdout: "don't 3\n"
  - id: h4
    name: large input within the efficiency band
    category: large-input
    generator: { repeat: "lorem ipsum dolor sit amet consectetur ", times: 20000 }
    expectedStdout: "amet 20000\nconsectetur 20000\ndolor 20000\nipsum 20000\nlorem 20000\nsit 20000\n"
