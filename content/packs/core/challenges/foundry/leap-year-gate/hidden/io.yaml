# Backend-only. The player sees hidden tests by category and pass/fail, never by content.
form: io
cases:
  - id: h1
    name: empty input prints nothing
    category: empty-input
    stdin: ""
    expected_stdout: ""
  - id: h2
    name: more centuries
    category: boundary
    stdin: "2100\n1600\n2400\n1700\n"
    expected_stdout: "common\nleap\nleap\ncommon\n"
  - id: h3
    name: year zero and negative years
    category: boundary
    stdin: "0\n-4\n-100\n-400\n-1\n"
    expected_stdout: "leap\nleap\ncommon\nleap\ncommon\n"
  - id: h4
    name: years next to leap years, with a blank line
    category: boundary
    stdin: "1996\n\n1999\n2004\n"
    expected_stdout: "leap\ncommon\nleap\n"
  # Reserve cases join the fight only when an enemy's Edge Case move reveals one of their category.
  - id: r1
    name: another century
    category: boundary
    reserve: true
    stdin: "1800\n"
    expected_stdout: "common\n"
