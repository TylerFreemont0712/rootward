features:
  - id: kiln-inscription
    x: 24
    y: 20
    label: "Inscription"
    text: "THE KILN KEEPS COUNT. Beyond this gate the Warden judges every ingot, and it has never once been asked to show its work."
portals:
  - id: to-bastion
    x: 21
    y: 1
    label: "Waystone to the Bastion"
    to: { zone: bastion, portal: to-foundry }
    arrive: { x: 21, y: 2 }
