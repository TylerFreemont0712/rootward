markers: []
features:
  - id: guild-hall-door
    x: 19
    y: 7
    label: "Guild Hall"
    text: "The Guild Board hangs inside: expeditions planned around what you know, and what you should learn next."
    effects: [{ open: guild-board }]
  - id: library-door
    x: 10
    y: 7
    label: "The Library"
    text: "Rows of shelves, and one of them is yours. The Chronicle of your fights is kept here."
    effects: [{ open: chronicle }]
  - id: testing-grounds
    x: 21
    y: 22
    label: "Testing Grounds"
    text: "Pick any job and drill it. Nothing here counts against you."
    effects: [{ open: practice }]
  - id: inn-door
    x: 10
    y: 22
    label: "The Warm Cache"
    text: "The common room is loud with Maintainers comparing stack traces. Someone is explaining a bug with a spoon and two bowls."
  - id: notice-board
    x: 16
    y: 13
    label: "Notice board"
    text: "WANTED: whoever keeps counting the ledger one short. REWARD: correct ledgers. -- Also: lost, one journeyman (Pell). Last seen on the Foundry road."
  - id: plaza-signpost
    x: 23
    y: 16
    label: "Signpost"
    text: "North: the Guild Hall. West: the Library and the Warm Cache. East: the Compiler's forge and the market. South: the gate and the Foundry road."
  - id: grove-road
    x: 2
    y: 13
    label: "Road west"
    text: "Beyond the river the road to the Grove of Structures is overgrown. The Guild has not cleared a way yet."
  - id: kernel-road
    x: 37
    y: 13
    label: "Road east"
    text: "A sealed door marked KERNEL HALLS. Whoever locked it did not leave you the permissions."
portals:
  - id: to-foundry
    x: 19
    y: 29
    label: "The Foundry road"
    to: { zone: foundry, portal: to-bastion }
    arrive: { x: 19, y: 28 }
    if: { flag: sworn-in }
    locked_text: "Guard Hollis steps into the road: \"Sworn Maintainers only. The Guildmaster is in the Guild Hall.\""
