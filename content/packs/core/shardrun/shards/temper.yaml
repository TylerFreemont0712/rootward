id: temper
name: Temper
rarity: common
cost: 1
function: temper
summary: "Rounds every bolt's power up to the next multiple of 5."
tags: [loops, lists]
code:
  python: |
    def temper(bolts, battle):
        tempered = []
        for bolt in bolts:
            power = bolt["power"]
            left_over = power % 5
            if left_over != 0:
                power = power + (5 - left_over)
            tempered.append({**bolt, "power": power})
        return tempered
  javascript: |
    function temper(bolts, battle) {
      const tempered = [];
      for (const bolt of bolts) {
        let power = bolt.power;
        const leftOver = power % 5;
        if (leftOver !== 0) power = power + (5 - leftOver);
        tempered.push({ ...bolt, power });
      }
      return tempered;
    }
examples:
  - name: rounded up, and left alone when already even
    bolts:
      - { power: 4, element: none, target: front, pierce: false, ward: false }
      - { power: 10, element: fire, target: front, pierce: false, ward: false }
      - { power: 11, element: frost, target: back, pierce: false, ward: false }
    expect:
      - { power: 5, element: none, target: front, pierce: false, ward: false }
      - { power: 10, element: fire, target: front, pierce: false, ward: false }
      - { power: 15, element: frost, target: back, pierce: false, ward: false }
