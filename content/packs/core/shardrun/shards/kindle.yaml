id: kindle
name: Kindle
rarity: common
cost: 1
function: kindle
summary: "Sets every bolt alight: fire, and 1 more power."
tags: [lists, dictionaries]
forge: { into: kindle-plus, verb: upgrade }
code:
  python: |
    def kindle(bolts, battle):
        return [{**bolt, "element": "fire", "power": bolt["power"] + 1} for bolt in bolts]
  javascript: |
    function kindle(bolts, battle) {
      return bolts.map((bolt) => ({ ...bolt, element: "fire", power: bolt.power + 1 }));
    }
examples:
  - name: one plain bolt
    bolts:
      - { power: 4, element: none, target: front, pierce: false, ward: false }
    expect:
      - { power: 5, element: fire, target: front, pierce: false, ward: false }
  - name: elements are replaced, not stacked
    bolts:
      - { power: 4, element: frost, target: front, pierce: false, ward: false }
      - { power: 1, element: none, target: front, pierce: false, ward: false }
    expect:
      - { power: 5, element: fire, target: front, pierce: false, ward: false }
      - { power: 2, element: fire, target: front, pierce: false, ward: false }
