id: chill
name: Chill
rarity: common
cost: 1
function: chill
summary: "Frosts every bolt: frost, and 1 more power."
tags: [lists, dictionaries]
forge: { into: chill-plus, verb: upgrade }
code:
  python: |
    def chill(bolts, battle):
        return [{**bolt, "element": "frost", "power": bolt["power"] + 1} for bolt in bolts]
  javascript: |
    function chill(bolts, battle) {
      return bolts.map((bolt) => ({ ...bolt, element: "frost", power: bolt.power + 1 }));
    }
examples:
  - name: one plain bolt
    bolts:
      - { power: 4, element: none, target: front, pierce: false, ward: false }
    expect:
      - { power: 5, element: frost, target: front, pierce: false, ward: false }
  - name: elements are replaced, not stacked
    bolts:
      - { power: 4, element: fire, target: front, pierce: false, ward: false }
      - { power: 1, element: none, target: front, pierce: false, ward: false }
    expect:
      - { power: 5, element: frost, target: front, pierce: false, ward: false }
      - { power: 2, element: frost, target: front, pierce: false, ward: false }
