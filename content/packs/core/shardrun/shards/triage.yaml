id: triage
name: Triage
rarity: uncommon
cost: 1
function: triage
summary: "Aims every bolt at the foe with the most HP left."
tags: [lists, dictionaries]
code:
  python: |
    def triage(bolts, battle):
        return [{**bolt, "target": "strongest"} for bolt in bolts]
  javascript: |
    function triage(bolts, battle) {
      return bolts.map((bolt) => ({ ...bolt, target: "strongest" }));
    }
examples:
  - name: every bolt changes aim
    bolts:
      - { power: 6, element: none, target: front, pierce: false, ward: false }
      - { power: 4, element: fire, target: back, pierce: false, ward: false }
    expect:
      - { power: 6, element: none, target: strongest, pierce: false, ward: false }
      - { power: 4, element: fire, target: strongest, pierce: false, ward: false }
