id: pierce
name: Pierce
rarity: common
cost: 1
function: pierce
summary: "Bolts ignore shields, but lose 1 power (never below 1)."
tags: [lists, min-max]
code:
  python: |
    def pierce(bolts, battle):
        return [{**bolt, "pierce": True, "power": max(1, bolt["power"] - 1)} for bolt in bolts]
  javascript: |
    function pierce(bolts, battle) {
      return bolts.map((bolt) => ({ ...bolt, pierce: true, power: Math.max(1, bolt.power - 1) }));
    }
examples:
  - name: pierces for one less
    bolts:
      - { power: 4, element: none, target: front, pierce: false, ward: false }
    expect:
      - { power: 3, element: none, target: front, pierce: true, ward: false }
  - name: never drops below 1
    bolts:
      - { power: 1, element: none, target: front, pierce: false, ward: false }
    expect:
      - { power: 1, element: none, target: front, pierce: true, ward: false }
