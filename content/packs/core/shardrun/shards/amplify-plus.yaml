id: amplify-plus
name: Amplify+
rarity: common
cost: 1
function: amplify_plus
summary: "Adds 5 power to every bolt."
tags: [lists, comprehension]
draftable: false
code:
  python: |
    def amplify_plus(bolts, battle):
        return [{**bolt, "power": bolt["power"] + 5} for bolt in bolts]
  javascript: |
    function amplifyPlus(bolts, battle) {
      return bolts.map((bolt) => ({ ...bolt, power: bolt.power + 5 }));
    }
examples:
  - name: one bolt
    bolts:
      - { power: 4, element: none, target: front, pierce: false, ward: false }
    expect:
      - { power: 9, element: none, target: front, pierce: false, ward: false }
  - name: no bolts, nothing to do
    bolts: []
    expect: []
  - name: each bolt gets its own boost
    bolts:
      - { power: 2, element: none, target: front, pierce: false, ward: false }
      - { power: 6, element: frost, target: front, pierce: false, ward: false }
    expect:
      - { power: 7, element: none, target: front, pierce: false, ward: false }
      - { power: 11, element: frost, target: front, pierce: false, ward: false }
